name: Hands Proof Bootstrap

on:
  push:
    branches:
      - agent2/hands-android-emulator-proof

permissions:
  actions: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Trigger Android APK Release for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/dispatches" \
            -f "ref=$BRANCH" \
            -F return_run_details=true \
            | tee android-dispatch.json
          test -n "$(jq -r '.workflow_run_id // empty' android-dispatch.json)"
          echo "android_dispatch_run=$(jq -r '.workflow_run_id' android-dispatch.json)" >> "$GITHUB_OUTPUT"

      - name: Wait for branch APK build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.dispatch.outputs.android_run_id }}
        run: |
          set -euo pipefail
          if [ -z "${RUN_ID:-}" ]; then
            RUN_ID=$(jq -r '.workflow_run_id // empty' android-dispatch.json)
          fi
          test -n "$RUN_ID"
          echo "RUN_ID=$RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"
          for i in $(seq 1 90); do
            STATUS=$(gh run view "$RUN_ID" --json status --jq '.status')
            CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion // ""')
            echo "build status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = completed ]; then
              test "$CONCLUSION" = success
              echo "android_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 30
          done
          echo "Android APK build timeout" >&2
          exit 1

      - name: Trigger real Android Hands emulator smoke
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build.outputs.android_run_id }}
        run: |
          set -euo pipefail
          gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/hands-android-emulator.yml/dispatches" \
            -f ref=main \
            -f "inputs[android_run_id]=$RUN_ID" \
            -F return_run_details=true \
            | tee hands-dispatch.json
          HANDS_ID=$(jq -r '.workflow_run_id // empty' hands-dispatch.json)
          test -n "$HANDS_ID"
          echo "hands_run_id=$HANDS_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for Hands emulator evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HANDS_ID: ${{ steps.hands.outputs.hands_run_id }}
        run: |
          set -euo pipefail
          test -n "$HANDS_ID"
          for i in $(seq 1 60); do
            STATUS=$(gh run view "$HANDS_ID" --json status --jq '.status')
            CONCLUSION=$(gh run view "$HANDS_ID" --json conclusion --jq '.conclusion // ""')
            echo "hands status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = completed ]; then
              test "$CONCLUSION" = success
              gh run view "$HANDS_ID" --web || true
              exit 0
            fi
            sleep 30
          done
          echo "Hands emulator run did not complete within timeout" >&2
          exit 1
