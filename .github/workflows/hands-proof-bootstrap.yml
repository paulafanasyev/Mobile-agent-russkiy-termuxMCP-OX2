name: Hands Proof Bootstrap

on:
  push:
    branches:
      - agent2/hands-android-emulator-proof

permissions:
  actions: write
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Trigger Android APK Release for this branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh workflow run android.yml --ref "$BRANCH"

      - name: Wait for branch APK build
        id: build
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          RUN_ID=""
          for i in $(seq 1 90); do
            RUN_ID=$(gh run list --workflow android.yml --branch "$BRANCH" --event workflow_dispatch --commit "$SHA" --limit 1 --json databaseId --jq '.[0].databaseId // empty')
            if [ -n "$RUN_ID" ]; then break; fi
            sleep 20
          done
          test -n "$RUN_ID"
          echo "RUN_ID=$RUN_ID" | tee -a "$GITHUB_STEP_SUMMARY"

          for i in $(seq 1 90); do
            STATUS=$(gh run view "$RUN_ID" --json status --jq '.status')
            CONCLUSION=$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion // ""')
            echo "build status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = completed ]; then
              test "$CONCLUSION" = success
              echo "android_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
              break
            fi
            sleep 30
          done
          test -n "$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion // empty')"
          test "$(gh run view "$RUN_ID" --json conclusion --jq '.conclusion')" = success

      - name: Trigger real Android Hands emulator smoke
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build.outputs.android_run_id }}
        run: |
          set -euo pipefail
          gh workflow run hands-android-emulator.yml --ref main -f android_run_id="$RUN_ID"

      - name: Wait for Hands emulator evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.build.outputs.android_run_id }}
        run: |
          set -euo pipefail
          HANDS_ID=""
          for i in $(seq 1 60); do
            HANDS_ID=$(gh run list --workflow hands-android-emulator.yml --event workflow_dispatch --limit 10 --json databaseId,createdAt --jq '.[0].databaseId // empty')
            if [ -n "$HANDS_ID" ]; then
              INPUT_RUN=$(gh run view "$HANDS_ID" --json event --jq '.event // ""' 2>/dev/null || true)
              break
            fi
            sleep 20
          done
          test -n "$HANDS_ID"

          for i in $(seq 1 60); do
            STATUS=$(gh run view "$HANDS_ID" --json status --jq '.status')
            CONCLUSION=$(gh run view "$HANDS_ID" --json conclusion --jq '.conclusion // ""')
            echo "hands status=$STATUS conclusion=$CONCLUSION"
            if [ "$STATUS" = completed ]; then
              test "$CONCLUSION" = success
              gh run view "$HANDS_ID" --web || true
              exit 0
            fi
            sleep 30
          done
          echo "Hands emulator run did not complete within timeout" >&2
          exit 1
