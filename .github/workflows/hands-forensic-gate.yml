name: Hands Forensic Gate
on:
  workflow_run:
    workflows: ["Android APK Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      android_run_id:
        description: "Successful Android APK Release run"
        required: true
        type: string
permissions:
  actions: read
  contents: read
jobs:
  hands-forensic:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact Android source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Verify provenance
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.android_run_id }}
        run: |
          set -euo pipefail
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .head_sha)
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq .conclusion)
          MAIN_SHA=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          test "$CONCLUSION" = success
          test "$SHA" = "$(git rev-parse HEAD)"
          test "$SHA" = "$MAIN_SHA"
          gh api "repos/$GITHUB_REPOSITORY/contents/src/app/(root)/hands-smoke.tsx?ref=$SHA" --jq .content | base64 -d | grep -Fq 'PASS:REAL_ACCESSIBILITY_TAP_VERIFIED'
          printf 'source_run_id=%s\nsource_sha=%s\nsource_conclusion=%s\nmain_sha=%s\n' "$RUN_ID" "$SHA" "$CONCLUSION" "$MAIN_SHA" | tee hands-provenance.txt
      - name: Download exact release APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.android_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="mobile-agent-russkiy-release-apk" and .expired==false) | .id' | head -1)
          test -n "$ID"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/apk/a.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ID/zip"
          unzip -o "$RUNNER_TEMP/apk/a.zip" -d "$RUNNER_TEMP/apk/u" >/dev/null
          APK=$(find "$RUNNER_TEMP/apk/u" -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" hands-smoke.apk
          sha256sum hands-smoke.apk | tee hands-apk-sha256.txt
      - name: Validate forensic contract
        run: |
          set -euo pipefail
          bash -n scripts/hands-android-probe.sh
          test -x scripts/hands-android-probe.sh || chmod +x scripts/hands-android-probe.sh
          grep -Fq 'PASS:H1_INSTALL' scripts/hands-android-probe.sh
          grep -Fq 'PASS:H12_HANDS_NATIVE_INTENT_REQUESTED' scripts/hands-android-probe.sh
          grep -Fq 'PASS:REAL_ACCESSIBILITY_TAP_VERIFIED' scripts/hands-android-probe.sh
          grep -Eq 'mResumedActivity|topResumedActivity' scripts/hands-android-probe.sh
          grep -Fq 'full-logcat.txt' scripts/hands-android-probe.sh
          grep -Fq 'adb-devices.txt' scripts/hands-android-probe.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Hands H1-H14 emulator probe
        id: hands_probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/scripts/hands-android-probe.sh"
      - name: Enforce evidence gate
        if: always()
        run: |
          set -u
          test -s adb-devices.txt || { echo 'FAIL:missing adb-devices.txt'; exit 1; }
          grep -Eq '^emulator-5554[[:space:]]+device([[:space:]]|$)' adb-devices.txt || { echo 'FAIL:missing emulator-5554 device evidence'; exit 1; }
          test -s hands-runtime.txt || { echo 'FAIL:missing hands-runtime.txt'; exit 1; }
          for i in $(seq 1 12); do grep -Eq "^(PASS|FAIL):H${i}_" hands-runtime.txt || { echo "FAIL:missing H${i}"; exit 1; }; done
          grep -Fq 'PASS:H10_REAL_ACCESSIBILITY_TAP_VERIFIED' hands-runtime.txt || exit 1
          grep -Fq 'PASS:H11_HANDS_OPEN_APP_RESULT' hands-runtime.txt || exit 1
          grep -Fq 'PASS:H12_HANDS_NATIVE_INTENT_REQUESTED' hands-runtime.txt || exit 1
          test -s hands-top.txt || exit 1
          grep -Eq 'mResumedActivity|topResumedActivity' hands-top.txt || exit 1
          grep -Fq 'com.android.settings' hands-top.txt || exit 1
          test -s hands-dumpsys.txt || exit 1
          grep -Eq 'mResumedActivity|topResumedActivity' hands-dumpsys.txt || exit 1
          grep -Fq 'com.android.settings' hands-dumpsys.txt || exit 1
          grep -Fq 'PASS:HANDS_RUNTIME=PASS' hands-runtime.txt 2>/dev/null || grep -Fq 'HANDS_RUNTIME=PASS' hands-runtime.txt || exit 1
          test ! -s hands-fatal.txt
          test -s full-logcat.txt
          test -s hands-ox2-pid.txt || exit 1
          OX2_PID=$(head -n1 hands-ox2-pid.txt | tr -d '[:space:]')
          test -n "$OX2_PID" || exit 1
          if grep -E "[[:space:]]${OX2_PID}[[:space:]]" full-logcat.txt | grep -Eq 'FATAL EXCEPTION|AndroidRuntime|ANR'; then echo 'FAIL:OX2 PID has FATAL/ANR'; exit 1; fi
          test -s hands-provenance.txt
      - name: Upload forensic Hands evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hands-forensic-evidence-${{ github.run_id }}
          if-no-files-found: warn
          path: |
            hands-provenance.txt
            hands-apk-sha256.txt
            adb-devices.txt
            hands-runtime.txt
            hands-logcat.txt
            full-logcat.txt
            hands-dumpsys.txt
            hands-accessibility-dump.txt
            hands-launch.txt
            hands-top.txt
            hands-target-pid.txt
            hands-ox2-pid.txt
            hands-activities-before.txt
            hands-activities-after.txt
            hands-window-before.txt
            hands-window-after.txt
            hands-ui-before.xml
            hands-ui-after.xml
            hands-before.png
            hands-after.png
            hands-fatal.txt
