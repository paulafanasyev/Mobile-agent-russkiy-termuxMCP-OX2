name: Repair pnpm lockfile

on:
  workflow_dispatch:
  push:
    branches:
      - design/svetlana-ui-implementation-2026-08-28

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: design/svetlana-ui-implementation-2026-08-28
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Repair lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Verify only lockfile changed
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          changed="$(git diff --name-only)"
          printf '%s\n' "=== CHANGED FILES ==="
          if [[ -n "$changed" ]]; then
            printf '%s\n' "$changed"
          else
            echo "(none)"
          fi

          if [[ -z "$changed" ]]; then
            echo "No lockfile repair was necessary."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "$changed" != "pnpm-lock.yaml" ]]; then
            echo "Unexpected files changed by pnpm install:" >&2
            printf '%s\n' "$changed" >&2
            exit 1
          fi

          echo "Lockfile repair produced the expected single-file change."
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit repaired lockfile
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync pnpm lockfile with package.json"
          git push origin HEAD:design/svetlana-ui-implementation-2026-08-28
