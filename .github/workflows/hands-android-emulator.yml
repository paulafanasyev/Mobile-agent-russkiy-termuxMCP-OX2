name: Hands Android Emulator Smoke

on:
  workflow_run:
    workflows: ["Android APK Release"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      android_run_id:
        description: "Successful Android APK Release run containing the Hands smoke route"
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  hands-android:
    if: >-
      ${{
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact smoke-test revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Verify source run and Hands smoke route
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.android_run_id }}
        run: |
          set -euo pipefail
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')
          test "$CONCLUSION" = success
          test "$SOURCE_SHA" = "$(git rev-parse HEAD)"
          gh api "repos/$GITHUB_REPOSITORY/contents/src/app/(root)/hands-smoke.tsx?ref=$SOURCE_SHA" --jq '.content' | base64 -d | grep -q 'PASS:REAL_ACCESSIBILITY_TAP_VERIFIED'
          { echo "source_run_id=$RUN_ID"; echo "source_sha=$SOURCE_SHA"; echo "source_conclusion=$CONCLUSION"; } | tee hands-provenance.txt

      - name: Download release APK
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || inputs.android_run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apk"
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="mobile-agent-russkiy-release-apk" and .expired==false) | .id' | head -1)
          test -n "$ART_ID"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -o "$RUNNER_TEMP/apk/artifact.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"
          unzip -o "$RUNNER_TEMP/apk/artifact.zip" -d "$RUNNER_TEMP/apk/unpacked"
          APK=$(find "$RUNNER_TEMP/apk/unpacked" -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/hands-smoke.apk"
          sha256sum "$GITHUB_WORKSPACE/hands-smoke.apk" | tee hands-apk-sha256.txt

      - name: Enable KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Validate Hands probe syntax and evidence contract
        run: |
          set -euo pipefail
          bash -n scripts/hands-android-probe.sh
          test -x scripts/hands-android-probe.sh || chmod +x scripts/hands-android-probe.sh
          grep -Fq 'pm grant "$PKG" android.permission.RECORD_AUDIO' scripts/hands-android-probe.sh
          grep -Fq 'settings put secure accessibility_enabled 1' scripts/hands-android-probe.sh
          grep -Fq 'ACCESSIBILITY_SERVICE_BIND=PASS' scripts/hands-android-probe.sh
          grep -Fq 'mResumedActivity|topResumedActivity' scripts/hands-android-probe.sh
          grep -Fq 'PASS:REAL_ACCESSIBILITY_TAP_VERIFIED' scripts/hands-android-probe.sh
          grep -Fq 'com.android.settings' scripts/hands-android-probe.sh

      - name: Run real Android Hands probe
        id: hands_probe
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/scripts/hands-android-probe.sh"

      - name: Collect Hands evidence after probe
        if: always()
        run: |
          set +e
          echo "probe_outcome=${{ steps.hands_probe.outcome }}"
          pwd
          ls -la
          for f in hands-accessibility-dump.txt hands-logcat.txt hands-fatal.txt hands-runtime.txt hands-launch.txt hands-top.txt hands-target-pid.txt hands-activities-before.txt hands-window-before.txt hands-activities-after.txt hands-window-after.txt hands-ui-before.xml hands-ui-after.xml hands-before.png hands-after.png; do
            if [ -e "$f" ]; then echo "EVIDENCE_PRESENT=$f size=$(wc -c < "$f")"; else echo "EVIDENCE_MISSING=$f"; fi
          done
          if [ -f hands-logcat.txt ]; then grep -E 'HANDS_|PASS:' hands-logcat.txt || true; fi

      - name: Upload Hands evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hands-android-emulator-evidence
          path: |
            hands-provenance.txt
            hands-apk-sha256.txt
            hands-runtime.txt
            hands-accessibility-dump.txt
            hands-runtime.txt
            hands-launch.txt
            hands-top.txt
            hands-target-pid.txt
            hands-activities-before.txt
            hands-window-before.txt
            hands-activities-after.txt
            hands-window-after.txt
            hands-ui-before.xml
            hands-ui-after.xml
            hands-before.png
            hands-after.png
            hands-logcat.txt
            hands-fatal.txt
          if-no-files-found: warn

      - name: Enforce Hands probe result
        if: always()
        run: test "${{ steps.hands_probe.outcome }}" = success
