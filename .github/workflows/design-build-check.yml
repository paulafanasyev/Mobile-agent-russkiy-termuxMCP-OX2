name: Design Build Check

on:
  workflow_dispatch:
  push:
    branches:
      - design/svetlana-ui-implementation-2026-08-28

jobs:
  build-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.7'
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-21 platforms;android-23 platforms;android-35 build-tools;35.0.0 ndk;28.0.13004108'

      - name: Verify Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME missing}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/ndk/28.0.13004108/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          java -version
          go version
          sdkmanager --version

      - name: Install dependencies (frozen)
        run: pnpm install --frozen-lockfile

      - name: Verify lockfile unchanged
        run: test -z "$(git diff --name-only -- pnpm-lock.yaml)"

      - name: TypeScript compile
        run: pnpm exec tsc --noEmit

      - name: Build reproducible libbox.aar
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logs" "$RUNNER_TEMP/libbox"
          bash scripts/build-libbox-android.sh 2>&1 | tee "$RUNNER_TEMP/logs/libbox-build.log"
          test -s build/native/libbox.aar
          test -s build/native/libbox.aar.sha256
          test -s build/native/sing-box-revision.txt
          sha256sum -c build/native/libbox.aar.sha256
          test "$(cat build/native/sing-box-revision.txt)" = "670d7a7693918b765a17c44aee5afb5d47ead390"
          unzip -t build/native/libbox.aar >/dev/null
          cp build/native/libbox.aar "$RUNNER_TEMP/libbox/libbox.aar"
          cp build/native/libbox.aar.sha256 "$RUNNER_TEMP/libbox/libbox.aar.sha256"
          cp build/native/sing-box-revision.txt "$RUNNER_TEMP/libbox/sing-box-revision.txt"

      - name: Expo prebuild
        run: pnpm exec expo prebuild --platform android --clean

      - name: Verify dependency manifests unchanged
        run: git diff --exit-code -- package.json pnpm-lock.yaml

      - name: Restore libbox after prebuild
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native
          cp "$RUNNER_TEMP/libbox/libbox.aar" build/native/libbox.aar
          cp "$RUNNER_TEMP/libbox/libbox.aar.sha256" build/native/libbox.aar.sha256
          cp "$RUNNER_TEMP/libbox/sing-box-revision.txt" build/native/sing-box-revision.txt
          test -s build/native/libbox.aar
          sha256sum -c build/native/libbox.aar.sha256

      - name: Prepare local Maven libbox
        shell: bash
        run: |
          set -euo pipefail
          MAVEN_DIR="build/native/maven/ru/mirsamozanyatykh/libbox/1.0.0"
          mkdir -p "$MAVEN_DIR"
          cp build/native/libbox.aar "$MAVEN_DIR/libbox-1.0.0.aar"
          cat > "$MAVEN_DIR/libbox-1.0.0.pom" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>ru.mirsamozanyatykh</groupId>
            <artifactId>libbox</artifactId>
            <version>1.0.0</version>
            <packaging>aar</packaging>
          </project>
          EOF
          test -s "$MAVEN_DIR/libbox-1.0.0.aar"
          test -s "$MAVEN_DIR/libbox-1.0.0.pom"

      - name: Configure Android SDK path
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          test -s android/local.properties

      - name: Verify generated Gradle and libbox
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          grep -R "ru.mirsamozanyatykh:libbox:1.0.0" app/build.gradle
          test -s ../build/native/libbox.aar
          test -s ../build/native/maven/ru/mirsamozanyatykh/libbox/1.0.0/libbox-1.0.0.aar

      - name: Kotlin compile
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/logs"
          ./gradlew :expo:compileDebugKotlin --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/logs/kotlin-compile.log"

      - name: Upload build diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: design-build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/logs/libbox-build.log
            ${{ runner.temp }}/logs/kotlin-compile.log
            android/local.properties
          if-no-files-found: warn
