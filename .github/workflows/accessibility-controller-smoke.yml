name: Forensic Bedda Controller

on:
  push:
    branches:
      - forensic/bedda-legacy-fork
  workflow_dispatch:

permissions:
  contents: read

env:
  PKG: ru.mirsamozanyatykh.mobileagent
  GRADLE_OPTS: -Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError

jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false
      - name: Verify vendored legacy controller source
        shell: bash
        run: |
          set -euo pipefail
          test -s modules/react-native-accessibility-controller/package.json
          test -s modules/react-native-accessibility-controller/src/index.ts
          test -s modules/react-native-accessibility-controller/android/build.gradle
          test -s modules/react-native-accessibility-controller/android/src/main/AndroidManifest.xml
          test -s modules/react-native-accessibility-controller/android/src/main/java/com/paulafanasyev/ox2/accessibility/OX2BeddaAccessibilityService.kt
          echo 'BEDDA_CONTROLLER_SOURCE=LOCAL_VENDOR_PASS'
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Go 1.24.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.7'
          cache: false
      - name: Android SDK and NDK
        uses: android-actions/setup-android@v4
      - name: Install Android toolchain
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-21" "platforms;android-23" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;28.0.13004108"
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: Install JavaScript dependencies
        run: pnpm install --no-frozen-lockfile
      - name: TypeScript and unit-test gate
        run: |
          set -euo pipefail
          pnpm exec tsc --noEmit
          pnpm test
      - name: Build reproducible libbox
        run: bash scripts/build-libbox-android.sh 2>&1 | tee "$RUNNER_TEMP/libbox-build.log"
      - name: Verify libbox
        run: |
          set -euo pipefail
          test -s build/native/libbox.aar
          test -s build/native/libbox.aar.sha256
          sha256sum -c build/native/libbox.aar.sha256
          test "$(cat build/native/sing-box-revision.txt)" = "670d7a7693918b765a17c44aee5afb5d47ead390"
      - name: Prepare local Maven libbox
        shell: bash
        run: |
          set -euo pipefail
          MAVEN_DIR="build/native/maven/ru/mirsamozanyatykh/libbox/1.0.0"
          mkdir -p "$MAVEN_DIR"
          cp build/native/libbox.aar "$MAVEN_DIR/libbox-1.0.0.aar"
          cat > "$MAVEN_DIR/libbox-1.0.0.pom" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>ru.mirsamozanyatykh</groupId>
            <artifactId>libbox</artifactId>
            <version>1.0.0</version>
            <packaging>aar</packaging>
          </project>
          EOF
      - name: Expo prebuild
        run: pnpm exec expo prebuild --platform android --clean
      - name: Verify legacy controller declaration survived prebuild
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          test -s "$MANIFEST"
          grep -Fq 'com.paulafanasyev.ox2.accessibility.OX2BeddaAccessibilityService' "$MANIFEST"
          grep -Fq 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          grep -Fq '@xml/bedda_accessibility_service_config' "$MANIFEST"
          echo 'CONTROLLER_MANIFEST=PASS' | tee controller-build-gate.txt
      - name: Pin Gradle without mutating generated gradle.properties
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.13-bin.zip#' "$WRAPPER"
          test -f android/gradle.properties
          if grep -Fq 'META-INF/INDEX.LISTorg.gradle.jvmargs=' android/gradle.properties; then
            echo 'ERROR: malformed gradle.properties concatenation detected' >&2
            exit 1
          fi
          echo 'GRADLE_PROPERTIES_CONCATENATION=PASS'
      - name: Verify generated Netty packaging configuration
        shell: bash
        run: |
          set -euo pipefail
          PROPS=android/gradle.properties
          test -f "$PROPS"
          grep -Fxq 'android.packagingOptions.pickFirsts=META-INF/io.netty.versions.properties' "$PROPS"
          grep -Fxq 'android.packagingOptions.excludes=META-INF/INDEX.LIST' "$PROPS"
          ! grep -Fq 'META-INF/INDEX.LISTorg.gradle.jvmargs=' "$PROPS"
          ! grep -Fq 'META-INF/io.netty.versions.propertiesorg.gradle.jvmargs=' "$PROPS"
          if [ "$(tail -c 1 "$PROPS" | od -An -t x1 | tr -d ' \n')" != '0a' ]; then
            printf '\n' >> "$PROPS"
          fi
          test "$(tail -c 1 "$PROPS" | od -An -t x1 | tr -d ' \n')" = '0a'
          grep -Fq 'packagingOptions {' android/app/build.gradle
          grep -Fq 'findProperty("android.packagingOptions.$prop")' android/app/build.gradle
          echo 'GENERATED_NETTY_PACKAGING=PASS'
      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace --console=plain
      - name: Extract APK
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          cp "$APK" accessibility-controller-smoke.apk
          sha256sum accessibility-controller-smoke.apk | tee accessibility-controller-apk-sha256.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run real legacy Accessibility Controller emulator probe
        id: controller_probe
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash "$GITHUB_WORKSPACE/scripts/accessibility-controller-probe.sh"
      - name: Collect forensic evidence
        if: always()
        run: |
          set +e
          echo "probe_outcome=${{ steps.controller_probe.outcome }}" | tee controller-evidence-summary.txt
          for f in controller-accessibility-dump.txt controller-logcat.txt controller-launch.txt controller-top.txt controller-ui.xml controller-after.png controller-package.txt controller-activities.txt controller-fatal.txt accessibility-controller-runtime.txt accessibility-controller-apk-sha256.txt controller-build-gate.txt; do
            if [ -e "$f" ]; then echo "EVIDENCE_PRESENT=$f size=$(wc -c < "$f")" | tee -a controller-evidence-summary.txt; else echo "EVIDENCE_MISSING=$f" | tee -a controller-evidence-summary.txt; fi
          done
          if [ -f controller-accessibility-dump.txt ]; then grep -E 'OX2BeddaAccessibilityService|Bound services:' controller-accessibility-dump.txt || true; fi
          if [ -f controller-logcat.txt ]; then grep -E 'OX2BeddaAccessibility|ACCESSIBILITY_CONTROLLER_|PASS:' controller-logcat.txt || true; fi
      - name: Upload forensic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forensic-bedda-controller-evidence
          path: |
            accessibility-controller-apk-sha256.txt
            controller-build-gate.txt
            accessibility-controller-runtime.txt
            controller-accessibility-dump.txt
            controller-logcat.txt
            controller-launch.txt
            controller-top.txt
            controller-ui.xml
            controller-after.png
            controller-package.txt
            controller-activities.txt
            controller-fatal.txt
            controller-adb-devices.txt
            controller-ox2-pid.txt
            controller-settings-pid.txt
            controller-evidence-summary.txt
            ${{ runner.temp }}/libbox-build.log
          if-no-files-found: warn
