name: Smoke forensic evidence

on:
  workflow_run:
    workflows: ["M1+Smoke: манифест APK и эмуляторный smoke test (provenance-bound)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      smoke_run_id:
        description: "Smoke workflow run ID to inspect (explicit; required for manual forensic)"
        required: true
        default: ""

permissions:
  actions: read
  contents: read

jobs:
  forensic:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Resolve target smoke run (event-first, HARD-STOP, no substitution)
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.smoke_run_id || '' }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id || '' }}
        run: |
          set -euo pipefail
          if [ -n "$EVENT_RUN_ID" ]; then
            RUN_ID="$EVENT_RUN_ID"
            SOURCE="workflow_run-event"
          elif [ -n "$INPUT_RUN_ID" ]; then
            RUN_ID="$INPUT_RUN_ID"
            SOURCE="manual-explicit"
          else
            echo "::error::HARD STOP: no target source (neither workflow_run.id nor explicit smoke_run_id)."
            echo "::error::Automatic search of another run is FORBIDDEN by provenance rule."
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '{id,status,conclusion,head_sha,event,created_at}' | tee target-run.json >> "$GITHUB_STEP_SUMMARY"
          N=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '[.artifacts[] | select(.name=="smoke-evidence" and .expired==false)] | length')
          if [ "$N" -eq 0 ]; then
            echo "::error::HARD STOP: smoke-run $RUN_ID has NO living smoke-evidence."
            echo "::error::Substituting another run is FORBIDDEN. Run a fresh smoke instead."
            exit 1
          fi
          {
            echo "forensic_target_run=$RUN_ID"
            echo "resolution_source=$SOURCE"
            echo "artifact_alive=yes"
            echo "resolved_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } | tee provenance-forensic.txt >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download smoke-evidence artifact from target run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p evidence/unpacked
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts?per_page=100" --jq '.artifacts[] | select(.name=="smoke-evidence" and .expired==false) | .id' | head -1)
          test -n "$ART_ID" || { echo "::error::smoke-evidence unavailable for exact target run $RUN_ID"; exit 1; }
          echo "Artifact ID: $ART_ID"
          HTTP=$(curl -sL -w '%{http_code}' -o evidence/artifact.zip -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip")
          echo "Artifact download HTTP=$HTTP" >> "$GITHUB_STEP_SUMMARY"
          [ "$HTTP" = "200" ] || { echo "::error::Artifact download returned HTTP $HTTP for exact target run $RUN_ID"; exit 1; }
          unzip -t evidence/artifact.zip >/dev/null
          unzip -o evidence/artifact.zip -d evidence/unpacked >/dev/null
          find evidence/unpacked -maxdepth 1 -type f -printf '%f\n' | sort

      - name: Analyze crash evidence
        run: |
          set -euo pipefail
          E="evidence/unpacked"
          LOG="$E/full-logcat.txt"
          test -f "$LOG" || { echo "::error::full-logcat.txt missing"; exit 1; }
          awk '
            function flush() { if (!in_block) return; total++; if (app) app_total++; if (unsat) unsat_total++ }
            /FATAL EXCEPTION/ { flush(); in_block=1; app=0; unsat=0; next }
            in_block && /Process: ru\.mirsamozanyatykh\.mobileagent([ ,]|$)/ { app=1 }
            in_block && /UnsatisfiedLinkError/ { unsat=1 }
            END { flush(); print total+0 > "'"$E"'/forensic-fatal-blocks.txt"; print app_total+0 > "'"$E"'/forensic-app-attributed.txt"; print unsat_total+0 > "'"$E"'/forensic-unsatisfied-link-error.txt" }
          ' "$LOG"
          awk '/FATAL EXCEPTION/ { if (in_block) printf "%s", block > "'"$E"'/forensic-crash-blocks.txt"; block=$0 "\n"; in_block=1; next } in_block { block=block $0 "\n" } END { if (in_block) printf "%s", block > "'"$E"'/forensic-crash-blocks.txt" }' "$LOG"
          {
            echo "Smoke forensic report"
            echo "====================="
            echo "Run ID: $RUN_ID"
            echo "FATAL EXCEPTION blocks: $(cat "$E/forensic-fatal-blocks.txt")"
            echo "App-attributed blocks: $(cat "$E/forensic-app-attributed.txt")"
            echo "UnsatisfiedLinkError in fatal blocks: $(cat "$E/forensic-unsatisfied-link-error.txt")"
            echo ""
            echo "--- crash blocks ---"
            cat "$E/forensic-crash-blocks.txt" 2>/dev/null || true
            echo ""
            echo "--- process evidence ---"
            for f in pid.txt ps.txt resumed.txt focus.txt launch-time.txt restore-flag.txt apk-sha256.txt; do echo "### $f"; cat "$E/$f" 2>/dev/null || echo "<missing>"; done
          } | tee forensic-report.txt

      - name: Publish forensic summary
        if: always()
        run: |
          {
            echo "## Smoke forensic"
            echo "Run: $RUN_ID"
            echo "FATAL blocks: $(cat evidence/unpacked/forensic-fatal-blocks.txt 2>/dev/null || echo missing)"
            echo "App-attributed: $(cat evidence/unpacked/forensic-app-attributed.txt 2>/dev/null || echo missing)"
            echo "UnsatisfiedLinkError: $(cat evidence/unpacked/forensic-unsatisfied-link-error.txt 2>/dev/null || echo missing)"
            echo '```text'
            head -160 evidence/unpacked/forensic-crash-blocks.txt 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload forensic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-forensic-${{ env.RUN_ID }}
          path: |
            target-run.json
            provenance-forensic.txt
            forensic-report.txt
            evidence/unpacked/forensic-*.txt
            evidence/unpacked/full-logcat.txt
            evidence/unpacked/pid.txt
            evidence/unpacked/ps.txt
            evidence/unpacked/resumed.txt
            evidence/unpacked/focus.txt
            evidence/unpacked/launch-time.txt
            evidence/unpacked/restore-flag.txt
          if-no-files-found: warn
