name: Android APK Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate — TypeScript + unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Установить JavaScript-зависимости
        run: pnpm install --no-frozen-lockfile
      - name: Persist resolved pnpm lockfile
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'aster-hands-v2'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo 'lockfile already up to date'
            exit 0
          fi
          git commit -m 'sync: update pnpm lockfile'
          git push origin HEAD:aster-hands-v2
      - name: TypeScript typecheck
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test

  build-android:
    name: Сборка Android APK с реальным libbox
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Go 1.24.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.7'
          cache: false
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Android SDK и NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Установить и проверить Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME отсутствует}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install "platform-tools" "platforms;android-21" "platforms;android-23" "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" "build-tools;36.0.0" "ndk;28.0.13004108"
          export ANDROID_NDK_ROOT="$ANDROID_HOME/ndk/28.0.13004108"
          export ANDROID_NDK_HOME="$ANDROID_NDK_ROOT"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          java -version
          sdkmanager --version
          sdkmanager --sdk_root="$ANDROID_HOME" --list_installed | grep -E 'platforms;android-(21|23|35|36)|build-tools;(35|36).0.0|ndk;28.0.13004108'
          test -f "$ANDROID_HOME/platforms/android-21/android.jar"
          test -f "$ANDROID_HOME/platforms/android-23/android.jar"
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aapt2"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt2"
          test -x "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
      - name: Собрать воспроизводимый libbox.aar
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-libbox-android.sh 2>&1 | tee "$RUNNER_TEMP/libbox-build.log"
      - name: Проверить libbox
        shell: bash
        run: |
          set -euo pipefail
          test -s build/native/libbox.aar
          test -s build/native/libbox.aar.sha256
          test -s build/native/sing-box-revision.txt
          sha256sum -c build/native/libbox.aar.sha256
          test "$(cat build/native/sing-box-revision.txt)" = "670d7a7693918b765a17c44aee5afb5d47ead390"
          unzip -t build/native/libbox.aar >/dev/null
          bash scripts/verify-android-agent.sh
      - name: Подготовить локальный Maven-модуль libbox
        shell: bash
        run: |
          set -euo pipefail
          MAVEN_DIR="build/native/maven/ru/mirsamozanyatykh/libbox/1.0.0"
          mkdir -p "$MAVEN_DIR"
