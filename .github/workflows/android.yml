name: Android APK Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Сборка Android APK с реальным libbox
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
      - name: Design Gate — lightweight animated Svetlana orb
        shell: bash
        run: |
          set -uo pipefail
          failures=0
          check_file() {
            local label="$1" path="$2"
            if [ -s "$path" ]; then echo "PASS: $label"; else echo "FAIL: $label — missing or empty: $path"; failures=$((failures + 1)); fi
          }
          check_grep() {
            local label="$1" pattern="$2" path="$3"
            if grep -Fq -- "$pattern" "$path"; then echo "PASS: $label"; else echo "FAIL: $label — pattern not found: [$pattern] in $path"; failures=$((failures + 1)); fi
          }
          echo '=== SVETLANA ORB DESIGN GATE ==='
          check_file 'design contract exists' src/components/svetlana/svetlana-design.ts
          check_grep 'orb version' '2026-08-29-orb-v1' src/components/svetlana/svetlana-design.ts
          check_grep 'animated orb face type' 'animated-orb' src/components/svetlana/svetlana-design.ts
          check_grep 'fullSize' 'fullSize: 180' src/components/svetlana/svetlana-design.ts
          check_grep 'compactSize' 'compactSize: 80' src/components/svetlana/svetlana-design.ts
          check_grep 'viseme lip sync contract' 'lipSync: "viseme"' src/components/svetlana/svetlana-design.ts
          check_file 'avatar source exists' src/components/svetlana/svetlana-avatar.tsx
          check_grep 'avatar uses SvetlanaOrbState' 'SvetlanaOrbState' src/components/svetlana/svetlana-avatar.tsx
          check_grep 'avatar uses color scheme' 'useColorScheme' src/components/svetlana/svetlana-avatar.tsx
          check_grep 'avatar uses compact contract directly' 'SVETLANA_DESIGN.compactSize' src/components/svetlana/svetlana-avatar.tsx
          check_grep 'avatar binds mouth layer directly' 'nativeID={SVETLANA_DESIGN.mouthLayerId}' src/components/svetlana/svetlana-avatar.tsx
          if grep -Fq 'svetlana-approved.jpg' src/components/svetlana/svetlana-avatar.tsx; then echo 'FAIL: legacy JPG avatar dependency still present'; failures=$((failures + 1)); else echo 'PASS: no legacy JPG avatar dependency'; fi
          echo '=== DESIGN GATE SUMMARY ==='
          if [ "$failures" -ne 0 ]; then echo "::error::SVETLANA_ORB_DESIGN=FAIL failures=$failures"; exit 1; fi
          echo 'SVETLANA_ORB_DESIGN=PASS'
          echo 'Animated orb contract checks passed.' >> "$GITHUB_STEP_SUMMARY"
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Go 1.24.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.7'
          cache: false
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Android SDK и NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Generate native project
        run: npx expo prebuild --platform android --non-interactive
      - name: Verify libbox AAR exists
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/libs/libbox.aar
          ls -lh android/app/libs/libbox.aar
      - name: Build release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace
        timeout-minutes: 45
      - name: Verify release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          sha256sum "$APK"
          stat -c '%n %s bytes' "$APK"
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-russkiy-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: mobile-agent-russkiy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
