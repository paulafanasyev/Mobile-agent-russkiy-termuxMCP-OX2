name: Android APK Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate — TypeScript + unit tests
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: D0-A — подготовить Bedda v1.4.0 vendor
        run: bash scripts/vendor-bedda-v1.4.0.sh
      - name: D0-A verify — committed vendor
        shell: bash
        run: |
          set -euo pipefail
          VENDOR="$GITHUB_WORKSPACE/vendor/react-native-accessibility-controller"
          test -f "$VENDOR/package.json"
          test -f "$VENDOR/src/index.ts"
          test -f "$VENDOR/android/src/main/AndroidManifest.xml"
          node - "$VENDOR/package.json" <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          for (const k of ['main','module','types']) if (p[k] !== 'src/index.ts') throw new Error(`${k}=${p[k]}`);
          if (p.name !== 'react-native-accessibility-controller' || p.version !== '1.4.0') throw new Error('unexpected Bedda identity');
          console.log(JSON.stringify({name:p.name,version:p.version,main:p.main,module:p.module,types:p.types}));
          NODE
          grep -F 'export async function getAccessibilityTree' "$VENDOR/src/index.ts"
          grep -F 'export async function tapNode' "$VENDOR/src/index.ts"
          grep -F 'export async function globalAction' "$VENDOR/src/index.ts"
          grep -F 'export async function isServiceEnabled' "$VENDOR/src/index.ts"
      - name: D0-B — проверить react-native-tts-kit 0.1.2
        run: test "$(pnpm view react-native-tts-kit@0.1.2 version)" = "0.1.2"
      - name: D1 — установить JavaScript-зависимости
        run: pnpm install --no-frozen-lockfile
      - name: D1 verify — resolved Bedda package
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED="$(node -p "require.resolve('react-native-accessibility-controller/package.json')")"
          REAL="$(dirname "$(readlink -f "$RESOLVED")")"
          VENDOR="$GITHUB_WORKSPACE/vendor/react-native-accessibility-controller"
          echo "resolved=$RESOLVED"
          echo "real=$REAL"
          test -f "$REAL/package.json"
          node - "$REAL/package.json" <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          if (p.name !== 'react-native-accessibility-controller' || p.version !== '1.4.0') process.exit(1);
          if (p.main !== 'src/index.ts' || p.module !== 'src/index.ts' || p.types !== 'src/index.ts') process.exit(1);
          console.log(JSON.stringify({name:p.name,version:p.version,main:p.main,module:p.module,types:p.types}));
          NODE
          grep -F 'vendor/react-native-accessibility-controller' pnpm-lock.yaml
          diff -qr --exclude=node_modules --exclude=.git "$VENDOR" "$REAL"
      - name: D2 — TypeScript typecheck
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test

  build-android:
    name: Сборка Android APK с реальным libbox
    needs: quality
    runs-on: ubuntu-24.04
    steps:
      - name: Получить исходники
        uses: actions/checkout@v5
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Go 1.24.7
        uses: actions/setup-go@v6
        with:
          go-version: '1.24.7'
          cache: false
      - name: pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.29.2
          run_install: false
      - name: Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - name: Android SDK и NDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Установить Android SDK/NDK
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME отсутствует}"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses >/dev/null 2>&1 || true
          sdkmanager --sdk_root="$ANDROID_HOME" --install platform-tools platforms\;android-21 platforms\;android-23 platforms\;android-35 platforms\;android-36 build-tools\;35.0.0 build-tools\;36.0.0 ndk\;28.0.13004108
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
      - name: D0-A — подготовить Bedda vendor
        run: bash scripts/vendor-bedda-v1.4.0.sh
      - name: D1 — установить JavaScript-зависимости
        run: pnpm install --no-frozen-lockfile
      - name: D1 verify — resolved Bedda package
        shell: bash
        run: |
          set -euo pipefail
          RESOLVED="$(node -p "require.resolve('react-native-accessibility-controller/package.json')")"
          REAL="$(dirname "$(readlink -f "$RESOLVED")")"
          VENDOR="$GITHUB_WORKSPACE/vendor/react-native-accessibility-controller"
          test -f "$REAL/package.json"
          test "$(node -p "require('$REAL/package.json').name")" = "react-native-accessibility-controller"
          test "$(node -p "require('$REAL/package.json').version")" = "1.4.0"
          diff -qr --exclude=node_modules --exclude=.git "$VENDOR" "$REAL"
      - name: Собрать воспроизводимый libbox.aar
        shell: bash
        run: bash scripts/build-libbox-android.sh 2>&1 | tee "$RUNNER_TEMP/libbox-build.log"
      - name: Проверить libbox provenance
        shell: bash
        run: |
          set -euo pipefail
          test -s build/native/libbox.aar
          sha256sum -c build/native/libbox.aar.sha256
          test "$(cat build/native/sing-box-revision.txt)" = "670d7a7693918b765a17c44aee5afb5d47ead390"
          unzip -t build/native/libbox.aar >/dev/null
          bash scripts/verify-android-agent.sh
      - name: Подготовить локальный Maven libbox
        shell: bash
        run: |
          set -euo pipefail
          D=build/native/maven/ru/mirsamozanyatykh/libbox/1.0.0
          mkdir -p "$D"
          cp build/native/libbox.aar "$D/libbox-1.0.0.aar"
          cat > "$D/libbox-1.0.0.pom" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <project xmlns="http://maven.apache.org/POM/4.0.0">
            <modelVersion>4.0.0</modelVersion>
            <groupId>ru.mirsamozanyatykh</groupId>
            <artifactId>libbox</artifactId>
            <version>1.0.0</version>
            <packaging>aar</packaging>
          </project>
          EOF
          test -s "$D/libbox-1.0.0.aar"
      - name: Expo prebuild
        run: pnpm exec expo prebuild --platform android --clean
      - name: Configure Gradle and local Maven
        shell: bash
        run: |
          set -euo pipefail
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > android/local.properties
          WRAPPER=android/gradle/wrapper/gradle-wrapper.properties
          sed -i -E 's#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-8.13-bin.zip#' "$WRAPPER"
          test -s android/local.properties
          grep -R 'ru.mirsamozanyatykh:libbox:1.0.0' android/app/build.gradle
          test -s build/native/maven/ru/mirsamozanyatykh/libbox/1.0.0/libbox-1.0.0.aar
      - name: Configure Gradle heap
        shell: bash
        run: |
          cat >> android/gradle.properties <<'PROPS'
          org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          PROPS
      - name: D5 — Gradle debug build
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-debug.log"
      - name: D6 — merged manifest evidence
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/build/intermediates/merged_manifests/debug/processDebugManifest/AndroidManifest.xml
          test -f "$MANIFEST"
          grep -F 'com.beddatech.accessibilitycontroller.AccessibilityControllerService' "$MANIFEST"
          grep -F 'android.permission.BIND_ACCESSIBILITY_SERVICE' "$MANIFEST"
          grep -F 'android.accessibilityservice' "$MANIFEST"
      - name: D7 — APK evidence
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)
          test -s "$APK"
          echo "APK=$APK"
      - name: Собрать release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace --console=plain 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"
      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: mobile-agent-russiyskiy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Upload release APK
        uses: actions/upload-artifact@v5
        with:
          name: mobile-agent-russiyskiy-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v5
        with:
          name: android-build-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/gradle-debug.log
            ${{ runner.temp }}/gradle-release.log
            ${{ runner.temp }}/libbox-build.log
          if-no-files-found: warn
