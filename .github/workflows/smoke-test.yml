name: "M1+Smoke: манифест APK и эмуляторный smoke test (provenance-bound)"

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: 'ID успешного рана Android APK Release'
        required: true
        default: ''
  workflow_run:
    workflows: ["Android APK Release"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  m1-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact smoke-test revision
        uses: actions/checkout@v4

      - name: Provenance — привязать APK к конкретному Android-рану
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ github.event.inputs.android_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN_ID" ]; then RUN_ID="$INPUT_RUN_ID"; elif [ -n "$EVENT_RUN_ID" ]; then RUN_ID="$EVENT_RUN_ID"; else echo "::error::Нет источника run id"; exit 1; fi
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')
          SOURCE_CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')
          test "$SOURCE_CONCLUSION" = success || { echo "::error::APK source run $RUN_ID is not successful: $SOURCE_CONCLUSION"; exit 1; }
          { echo "smoke_head_sha=$GITHUB_SHA"; echo "apk_source_run=$RUN_ID"; echo "apk_source_head_sha=$SOURCE_SHA"; echo "apk_source_conclusion=$SOURCE_CONCLUSION"; } | tee provenance.txt
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Скачать APK из provenance-run (детерминированно)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/apk-staging"
          rm -rf "$STAGE" && mkdir -p "$STAGE/unpacked"
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select((.name=="mobile-agent-russkiy-release-apk" or .name=="mobile-agent-russkiy-debug-apk") and .expired==false) | .id' | head -1)
          test -n "$ART_ID" || { echo "::error::APK artifact не найден в ране $RUN_ID"; exit 1; }
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -o "$STAGE/artifact.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"
          unzip -o "$STAGE/artifact.zip" -d "$STAGE/unpacked" >/dev/null
          mapfile -t CANDIDATES < <(find "$STAGE/unpacked" -type f -name '*.apk' -print)
          test "${#CANDIDATES[@]}" -eq 1 || { echo "::error::ОЖИДАН РОВНО ОДИН APK, НАЙДЕНО: ${#CANDIDATES[@]}"; exit 1; }
          cp "${CANDIDATES[0]}" "$GITHUB_WORKSPACE/smoke.apk"
          test -s "$GITHUB_WORKSPACE/smoke.apk"
          sha256sum "$GITHUB_WORKSPACE/smoke.apk" | awk '{print $1}' > apk-sha256.txt
          stat -c%s "$GITHUB_WORKSPACE/smoke.apk" > apk-size.txt
          printf 'artifact_id=%s\nsource_run_id=%s\napk_sha256=%s\napk_size_bytes=%s\n' "$ART_ID" "$RUN_ID" "$(cat apk-sha256.txt)" "$(cat apk-size.txt)" > apk-facts.txt

      - name: M1 — бинарное чтение release-манифеста
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          BADGE=$("$BT/aapt2" dump badging "$GITHUB_WORKSPACE/smoke.apk")
          echo "$BADGE" | tee badging.txt
          echo "$BADGE" | grep -q "package: name='ru.mirsamozanyatykh.mobileagent'"
          echo "$BADGE" | grep -q "versionName='2.1.1'"
          echo "$BADGE" | grep -q "versionCode='3'"

      - name: Prepare strict smoke probe
        run: |
          cat > "$RUNNER_TEMP/smoke-probe.sh" <<'PROBE'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APK="$GITHUB_WORKSPACE/smoke.apk"
          test -s "$APK"
          adb install -r "$APK"
          adb logcat -c

          # Do not use `monkey`: its idle-state check is flaky on headless emulator images
          # and can abort a strict probe before the application is even inspected.
          adb shell am force-stop ru.mirsamozanyatykh.mobileagent || true
          adb shell am start -W \
            -a android.intent.action.MAIN \
            -c android.intent.category.LAUNCHER \
            -p ru.mirsamozanyatykh.mobileagent

          # Wait for the actual application process and UI instead of assuming a fixed delay.
          launched=0
          for _ in $(seq 1 30); do
            PID=$(adb shell pidof ru.mirsamozanyatykh.mobileagent 2>/dev/null | tr -d '\r\n ' || true)
            if [ -n "$PID" ]; then launched=1; break; fi
            sleep 2
          done
          test "$launched" -eq 1 || {
            echo '::error::OX2 process did not start'
            adb shell dumpsys activity activities | tail -160 || true
            adb logcat -d -v time | tail -240 || true
            exit 1
          }

          PID=$(adb shell pidof ru.mirsamozanyatykh.mobileagent 2>/dev/null | tr -d '\r\n ' || true)
          PS_LINE=$(adb shell ps -A 2>/dev/null | tr -d '\r' | grep mirsamozanyatykh || true)
          RAW_RESUMED=$(adb shell dumpsys activity activities 2>/dev/null | tr -d '\r' | grep -E 'ResumedActivity|topResumedActivity' | grep mirsamozanyatykh || true)
          FOCUS=$(adb shell dumpsys window 2>/dev/null | tr -d '\r' | grep mCurrentFocus || true)

          dump_ui() {
            rm -f ui-dump.xml
            local out=''
            for _ in $(seq 1 15); do
              if adb shell uiautomator dump /sdcard/ui.xml >/tmp/uiautomator-dump.txt 2>&1; then
                if adb shell cat /sdcard/ui.xml > ui-dump.xml 2>/dev/null && [ -s ui-dump.xml ]; then
                  return 0
                fi
              fi
              sleep 2
            done
            echo '::error::UIAutomator dump failed or produced empty XML'
            cat /tmp/uiautomator-dump.txt 2>/dev/null || true
            adb shell dumpsys activity activities | tail -160 || true
            adb shell dumpsys window | tail -120 || true
            adb logcat -d -v time | tail -240 || true
            return 1
          }

          dump_ui

          # Current Svetlana UI contract.
          MARKERS=$(grep -oE 'Светлана|Голосовой чат|Говорить|Слушаю…|Светлана готовит ответ…' ui-dump.xml | sort -u || true)
          printf '%s\n' "$MARKERS" > js-ui.txt
          for marker in 'Светлана' 'Голосовой чат' 'Говорить'; do
            printf '%s\n' "$MARKERS" | grep -Fqx "$marker" || { echo "::error::UI marker missing: $marker"; exit 1; }
          done

          # Semantic activation must work against the actual visible control.
          B=$(sed -n 's/.*text="Говорить"[^>]*bounds="\[\([0-9]*\),\([0-9]*\)\]\[\([0-9]*\),\([0-9]*\)\]".*/\1 \2 \3 \4/p' ui-dump.xml | head -1)
          test -n "$B" || { echo '::error::Voice control "Говорить" not found'; exit 1; }
          read -r X1 Y1 X2 Y2 <<< "$B"
          CX=$(( (X1 + X2) / 2 )); CY=$(( (Y1 + Y2) / 2 ))
          adb shell input tap "$CX" "$CY"
          sleep 2
          rm -f ui-dump-after.xml
          adb shell uiautomator dump /sdcard/ui-after.xml >/tmp/uiautomator-after.txt 2>&1 || true
          adb shell cat /sdcard/ui-after.xml > ui-dump-after.xml 2>/dev/null || true
          test -s ui-dump-after.xml || {
            echo '::error::Post-tap UI dump failed or empty'
            cat /tmp/uiautomator-after.txt 2>/dev/null || true
            exit 1
          }
          grep -Eq 'Слушаю…|Слушаю' ui-dump-after.xml || { echo '::error::Voice activation did not reach listening state'; exit 1; }
          echo "ACTIVATION_TAP=ok($CX,$CY)" > activation.txt

          adb exec-out screencap -p > screenshot-before.png
          adb exec-out screencap -p > screenshot.png
          adb logcat -d -v time > full-logcat.txt || true

          awk '
            function flush_block(){if(!in_block)return; fatal_count++; if(app_seen)app_count++; if(unsat_seen)unsat_count++}
            /FATAL EXCEPTION/{flush_block();in_block=1;app_seen=0;unsat_seen=0;next}
            in_block && /Process: ru\.mirsamozanyatykh\.mobileagent([ ,]|$)/{app_seen=1}
            in_block && /UnsatisfiedLinkError/{unsat_seen=1}
            END{flush_block();print fatal_count+0 > "crash-total.txt";print app_count+0 > "crash-app-attributed.txt";print unsat_count+0 > "crash-unsatisfied-link-error.txt"}
          ' full-logcat.txt
          CRASH_TOTAL=$(cat crash-total.txt); APP_ATTRIBUTED=$(cat crash-app-attributed.txt)
          test "$APP_ATTRIBUTED" -eq 0
          test "$CRASH_TOTAL" -eq 0
          test -n "$PID"
          test -n "$PS_LINE"
          test -n "$RAW_RESUMED"
          echo "$PID" > pid.txt
          printf '%s\n' "$PS_LINE" > ps.txt
          printf '%s\n' "$RAW_RESUMED" > resumed.txt
          printf '%s\n' "$FOCUS" > focus.txt
          echo 0 > devlaunch-count.txt
          echo 'V4=PASSED' > verification.txt
          echo 'V6=PASSED' >> verification.txt
          echo 'SMOKE=PASSED' >> verification.txt
          echo 'STRICT_SMOKE=PASSED'
          PROBE
          chmod +x "$RUNNER_TEMP/smoke-probe.sh"
          bash -n "$RUNNER_TEMP/smoke-probe.sh"

      - name: KVM
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Strict Smoke v4 на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: bash "${{ runner.temp }}/smoke-probe.sh"

      - name: Evidence upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            provenance.txt
            apk-facts.txt
            apk-sha256.txt
            apk-size.txt
            pid.txt
            ps.txt
            resumed.txt
            focus.txt
            js-ui.txt
            activation.txt
            verification.txt
            devlaunch-count.txt
            crash-total.txt
            crash-app-attributed.txt
            crash-unsatisfied-link-error.txt
            ui-dump.xml
            ui-dump-after.xml
            screenshot-before.png
            screenshot.png
            full-logcat.txt
            badging.txt
            smoke.apk
          if-no-files-found: error
