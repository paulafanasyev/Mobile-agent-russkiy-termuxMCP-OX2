name: "M1+Smoke: Android launch compatibility"

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: 'ID успешного рана Android APK Release'
        required: true
        default: ''
  workflow_run:
    workflows: ["Android APK Release"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  m1-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Download exact release APK
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ github.event.inputs.android_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -eu
          if [ -n "$INPUT_RUN_ID" ]; then RUN_ID="$INPUT_RUN_ID"; elif [ -n "$EVENT_RUN_ID" ]; then RUN_ID="$EVENT_RUN_ID"; else exit 1; fi
          CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')
          test "$CONCLUSION" = success
          SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="mobile-agent-russkiy-release-apk" and .expired==false) | .id' | head -1)
          test -n "$ART_ID"
          mkdir -p "$RUNNER_TEMP/apk/unpacked"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" \
            -o "$RUNNER_TEMP/apk/artifact.zip" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"
          unzip -o "$RUNNER_TEMP/apk/artifact.zip" -d "$RUNNER_TEMP/apk/unpacked" >/dev/null
          APK_COUNT=$(find "$RUNNER_TEMP/apk/unpacked" -type f -name '*.apk' | wc -l | tr -d ' ')
          test "$APK_COUNT" -eq 1
          APK=$(find "$RUNNER_TEMP/apk/unpacked" -type f -name '*.apk' | head -1)
          cp "$APK" smoke.apk
          printf 'source_run_id=%s\nsource_sha=%s\n' "$RUN_ID" "$SHA" > provenance.txt
          sha256sum smoke.apk > apk-sha256.txt

      - name: M1 manifest
        run: |
          set -eu
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/aapt2" dump badging smoke.apk | tee badging.txt
          grep -q "package: name='ru.mirsamozanyatykh.mobileagent'" badging.txt
          grep -q "versionCode='3'" badging.txt

      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Strict launch smoke on API 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            set -eu
            adb install -r smoke.apk
            adb logcat -c
            adb shell am force-stop ru.mirsamozanyatykh.mobileagent || true
            adb shell am start -W -n ru.mirsamozanyatykh.mobileagent/.MainActivity
            PID=''
            for _ in $(seq 1 30); do
              PID=$(adb shell pidof ru.mirsamozanyatykh.mobileagent 2>/dev/null | tr -d '\r\n ' || true)
              if [ -n "$PID" ]; then break; fi
              sleep 2
            done
            test -n "$PID"
            adb exec-out screencap -p > screenshot.png
            adb shell dumpsys activity activities | tr -d '\r' > resumed.txt
            adb shell dumpsys window | tr -d '\r' > focus.txt
            grep -q 'ru.mirsamozanyatykh.mobileagent' resumed.txt
            grep -q 'mResumedActivity\|topResumedActivity' resumed.txt
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/ui.xml > ui-dump.xml 2>/dev/null || true
            adb logcat -d -v time > full-logcat.txt
            grep -E 'FATAL EXCEPTION|AndroidRuntime' full-logcat.txt > crash-evidence.txt || true
            test ! -s crash-evidence.txt
            echo 'STRICT_SMOKE=PASSED'

      - name: Evidence upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            provenance.txt
            apk-sha256.txt
            badging.txt
            screenshot.png
            resumed.txt
            focus.txt
            ui-dump.xml
            full-logcat.txt
            crash-evidence.txt
          if-no-files-found: warn
