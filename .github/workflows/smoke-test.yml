name: "M1+Smoke: манифест APK и эмуляторный smoke test"

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  m1-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Скачать последний успешный APK-артефакт
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android.yml/runs?status=success&per_page=10" --jq '.workflow_runs | map(select(.head_branch == "main")) | .[0].id')
          test -n "$RUN_ID"
          echo "source run: $RUN_ID"
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="mobile-agent-russkiy-debug-apk" and .expired==false) | .id' | head -1)
          test -n "$ART_ID"
          echo "artifact id: $ART_ID"
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GH_TOKEN" \
            -o apk.zip \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"
          unzip -o apk.zip
          APK=$(find . -maxdepth 2 -type f -name '*.apk' | head -1)
          test -n "$APK"
          cp "$APK" smoke.apk
          ls -lh smoke.apk

      - name: M1 — бинарное чтение манифеста (aapt2)
        shell: bash
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/aapt2" dump badging smoke.apk | head -25 | tee badging.txt
          grep -q "package: name='ru.mirsamozanyatykh.mobileagent'" badging.txt
          grep -q "versionCode='3'" badging.txt
          grep -q "versionName='2.1.1'" badging.txt
          {
            echo "### M1: aapt2 dump badging"
            echo '```'
            cat badging.txt
            echo '```'
            echo "M1 verdict: PASS — package/versionName/versionCode подтверждены бинарным чтением APK"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: KVM для ускорения эмулятора
        shell: bash
        run: |
          set -euo pipefail
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -al /dev/kvm

      - name: Smoke test на эмуляторе
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          script: |
            set -x
            cd "$GITHUB_WORKSPACE"
            pwd > where-am-i.txt
            APK="$(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name '*.apk' -print -quit)"
            test -n "$APK" || { echo "::error::APK NOT FOUND"; exit 1; }
            test -s "$APK" || { echo "::error::APK EMPTY"; exit 1; }
            echo "APK=$APK"
            adb install -r "$APK" || { echo "::error::INSTALL FAILED"; exit 1; }
            echo "PHASE: INSTALL OK"
            adb shell monkey -p ru.mirsamozanyatykh.mobileagent -c android.intent.category.LAUNCHER 1 || echo "::warning::monkey rc=$? (continuing)"
            echo "PHASE: LAUNCH SENT"
            sleep 60
            echo "PHASE: SURVIVED 60s"
            PID=$(adb shell pidof ru.mirsamozanyatykh.mobileagent 2>/dev/null | tr -d '\r\n ' || true)
            PS_LINE=$(adb shell ps -A 2>/dev/null | tr -d '\r' | grep mirsamozanyatykh || true)
            RAW_RESUMED=$(adb shell dumpsys activity activities 2>/dev/null | tr -d '\r' | grep -E "ResumedActivity|topResumedActivity" | grep mirsamozanyatykh || true)
            FOCUS=$(adb shell dumpsys window 2>/dev/null | tr -d '\r' | grep mCurrentFocus || true)
            RESUMED_CLASS=$(echo "$RAW_RESUMED" | grep -oE "[a-zA-Z0-9.]+Activity" | head -1 || true)
            DEVLAUNCH=$(adb shell dumpsys window 2>/dev/null | tr -d '\r' | grep -c devlauncher || true)
            adb shell uiautomator dump /sdcard/ui.xml >/dev/null 2>&1 || true
            adb shell cat /sdcard/ui.xml > ui-dump.xml 2>/dev/null || true
            JS_TEXTS=$(grep -oE "Светлана онлайн|Активировать Светлану|Голосовая команда" ui-dump.xml 2>/dev/null | sort -u || true)
            adb logcat -d -v time > full-logcat.txt || true
            grep -icE "FATAL EXCEPTION|AndroidRuntime|UnsatisfiedLinkError" full-logcat.txt > crash-count.txt || true
            adb exec-out screencap -p > screenshot.png || true
            W="$GITHUB_WORKSPACE"
            printf '%s' "$PID" > "$W/pid.txt"
            printf '%s\n' "$PS_LINE" > "$W/ps.txt"
            printf '%s\n' "$RAW_RESUMED" > "$W/resumed.txt"
            printf '%s\n' "$FOCUS" > "$W/focus.txt"
            printf '%s\n' "$JS_TEXTS" > "$W/js-ui.txt"
            printf '%s\n' "$DEVLAUNCH" > "$W/devlaunch-count.txt"
            ls -la "$W" > "$W/inventory.txt" 2>&1 || true
            {
              echo "### Probe v3.2"
              echo "cwd: $(cat where-am-i.txt)"
              echo "APK used: $APK"
              echo "PID(secondary): '$PID'"
              echo ""
              echo '```'; cat "$W/ps.txt"; echo '```'
              echo ""
              echo '```'; cat "$W/resumed.txt"; echo '```'
              echo "Resumed class: $RESUMED_CLASS"
              echo ""
              echo '```'; cat "$W/focus.txt"; echo '```'
              echo "DevLauncher-in-focus: $DEVLAUNCH (informational)"
              echo ""
              echo '```'; cat "$W/js-ui.txt"; echo '```'
              echo "Crash signatures: $(cat "$W/crash-count.txt")"
            } >> "$GITHUB_STEP_SUMMARY"
            CRASHES=$(cat "$W/crash-count.txt")
            if [ "${CRASHES:-0}" -gt 0 ]; then echo "::error::FAILED: crash signatures"; exit 1; fi
            if [ -z "$PS_LINE" ] && [ -z "$PID" ]; then echo "::error::FAILED: no process trace"; exit 1; fi
            if [ -n "$PS_LINE" ] && [ -n "$RAW_RESUMED" ] && [ -n "$JS_TEXTS" ]; then
              echo "::notice::SMOKE PASSED: native alive + foreground + positive JS evidence"
            else
              echo "::warning::INCONCLUSIVE: partial evidence set - review artifacts"
            fi

      - name: Проверить наличие evidence-файлов
        if: always()
        shell: bash
        run: |
          set -u
          {
            echo "### Evidence inventory"
            for f in where-am-i.txt inventory.txt pid.txt ps.txt resumed.txt focus.txt js-ui.txt devlaunch-count.txt crash-count.txt full-logcat.txt screenshot.png; do
              if [ -e "$f" ]; then
                echo "- $f: present"
              else
                echo "- $f: MISSING"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Загрузить доказательства
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: |
            smoke.apk
            badging.txt
            install.txt
            launch.txt
            where-am-i.txt
            inventory.txt
            pid.txt
            ps.txt
            resumed.txt
            focus.txt
            js-ui.txt
            devlaunch-count.txt
            full-logcat.txt
            crash-count.txt
            screenshot.png
            ui-dump.xml
          if-no-files-found: warn
