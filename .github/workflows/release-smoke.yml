name: "Chat+Hands Release Smoke"

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: "ID успешного рана Android APK Release"
        required: true
        default: ""
  workflow_run:
    workflows: ["Android APK Release"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  release-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Provenance — exact release APK
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ github.event.inputs.android_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN_ID" ]; then RUN_ID="$INPUT_RUN_ID"; elif [ -n "$EVENT_RUN_ID" ]; then RUN_ID="$EVENT_RUN_ID"; else exit 1; fi
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')
          SOURCE_CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')
          test "$SOURCE_CONCLUSION" = success
          { echo "smoke_head_sha=$GITHUB_SHA"; echo "apk_source_run=$RUN_ID"; echo "apk_source_head_sha=$SOURCE_SHA"; echo "apk_source_conclusion=$SOURCE_CONCLUSION"; } | tee provenance.txt
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download exact release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/apk-staging"
          rm -rf "$STAGE" && mkdir -p "$STAGE/unpacked"
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="mobile-agent-russkiy-release-apk" and .expired==false) | .id' | head -1)
          test -n "$ART_ID"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -o "$STAGE/artifact.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"
          unzip -o "$STAGE/artifact.zip" -d "$STAGE/unpacked"
          CANDIDATES=$(find "$STAGE/unpacked" -type f -name '*.apk')
          test "$(printf '%s\n' "$CANDIDATES" | grep -c .)" -eq 1
          cp "$(echo "$CANDIDATES" | head -1)" release-smoke.apk
          sha256sum release-smoke.apk | tee apk-sha256.txt
          stat -c%s release-smoke.apk | tee apk-size.txt
          echo "artifact_id=$ART_ID" > apk-facts.txt
          echo "source_run_id=$RUN_ID" >> apk-facts.txt

      - name: M1 — release manifest
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/aapt2" dump badging release-smoke.apk | tee badging.txt | head -25
          if ! grep -q "package: name='ru.mirsamozanyatykh.mobileagent'" badging.txt; then
            echo 'FAIL:M1_PACKAGE_NAME' | tee m1-fail.txt
            exit 1
          fi
          if ! grep -q "versionCode='3'" badging.txt; then
            echo 'FAIL:M1_VERSION_CODE' | tee m1-fail.txt
            exit 1
          fi
          echo 'M1_MANIFEST=PASS' | tee m1-runtime.txt

      - name: Prepare Chat runtime probe
        env:
          PROBE_SCRIPT: ${{ runner.temp }}/release-smoke-probe.sh
        run: |
          cat > "$PROBE_SCRIPT" <<'PROBE_EOF'
          #!/usr/bin/env bash
          set -u
          cd "$GITHUB_WORKSPACE"
          APK="$GITHUB_WORKSPACE/release-smoke.apk"
          FAIL=0
          fail() { echo "FAIL:$1" | tee -a runtime.txt; FAIL=1; }
          require() { local label="$1"; shift; if ! "$@"; then fail "$label"; fi; }
          : > runtime.txt
          : > m1-runtime.txt
          if [ ! -s "$APK" ]; then fail 'APK_MISSING'; exit 1; fi

          if ! adb install -r "$APK"; then
            fail 'APK_INSTALL'
            adb devices -l > adb-devices.txt 2>&1 || true
            adb shell getprop > fail-getprop.txt 2>&1 || true
            adb logcat -d -v time > full-logcat.txt 2>&1 || true
            exit 1
          fi
          adb logcat -c || true
          echo 'INSTALL=PASS' | tee -a runtime.txt

          if ! adb shell monkey -p ru.mirsamozanyatykh.mobileagent -c android.intent.category.LAUNCHER 1 > launch.txt 2>&1; then
            fail 'LAUNCH_COMMAND'
          else
            echo 'LAUNCH_COMMAND=PASS' | tee -a runtime.txt
          fi
          sleep 10

          adb devices -l > adb-devices.txt 2>&1 || true
          adb shell dumpsys activity activities | tr -d '\r' > chat-activities.txt 2>&1 || true
          adb shell dumpsys window | tr -d '\r' > chat-window.txt 2>&1 || true
          adb shell dumpsys package ru.mirsamozanyatykh.mobileagent | tr -d '\r' > chat-package.txt 2>&1 || true
          adb shell pidof ru.mirsamozanyatykh.mobileagent > chat-pid.txt 2>&1 || true
          adb logcat -d -v time > full-logcat.txt 2>&1 || true

          if ! grep -q 'ru.mirsamozanyatykh.mobileagent' chat-activities.txt; then
            fail 'CHAT_ACTIVITY_NOT_FOUND'
          else
            echo 'CHAT_ACTIVITY=PASS' | tee -a runtime.txt
          fi

          if [ ! -s chat-screenshot.png ]; then
            if ! adb exec-out screencap -p > chat-screenshot.png 2>screenshot.err; then
              fail 'SCREENSHOT_COMMAND'
            elif [ ! -s chat-screenshot.png ]; then
              fail 'SCREENSHOT_EMPTY'
            else
              echo 'SCREENSHOT=PASS' | tee -a runtime.txt
            fi
          else
            echo 'SCREENSHOT=PASS' | tee -a runtime.txt
          fi

          if grep -Eq 'FATAL EXCEPTION|AndroidRuntime.*FATAL' full-logcat.txt && grep -Eq 'Process: ru\.mirsamozanyatykh\.mobileagent([ ,]|$)' full-logcat.txt; then
            fail 'CRASH_GATE'
          else
            echo 'CRASH_GATE=PASS' | tee -a runtime.txt
          fi

          if [ "$FAIL" -ne 0 ]; then
            echo 'P0_RUNTIME=FAIL' | tee -a runtime.txt
            adb shell dumpsys activity activities > fail-activities.txt 2>&1 || true
            adb shell dumpsys window > fail-window.txt 2>&1 || true
            exit 1
          fi
          echo 'CHAT_ROUTE=PASS' | tee -a runtime.txt
          echo 'P0_RUNTIME=PASS' | tee -a runtime.txt
          PROBE_EOF
          chmod +x "$PROBE_SCRIPT"
          bash -n "$PROBE_SCRIPT"

      - name: Release smoke on API 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash "${{ runner.temp }}/release-smoke-probe.sh"

      - name: Upload Chat runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-evidence
          path: |
            provenance.txt
            apk-facts.txt
            apk-sha256.txt
            apk-size.txt
            badging.txt
            m1-runtime.txt
            m1-fail.txt
            runtime.txt
            launch.txt
            adb-devices.txt
            chat-screenshot.png
            chat-activities.txt
            chat-window.txt
            chat-package.txt
            chat-pid.txt
            fail-activities.txt
            fail-window.txt
            fail-getprop.txt
            screenshot.err
            chat-ui.xml
            full-logcat.txt
          if-no-files-found: warn
