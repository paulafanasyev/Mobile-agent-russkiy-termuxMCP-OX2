name: "Chat+Hands Release Smoke"

on:
  workflow_dispatch:
    inputs:
      android_run_id:
        description: "ID успешного рана Android APK Release"
        required: true
        default: ""
  workflow_run:
    workflows: ["Android APK Release"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  release-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Provenance — exact release APK
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ github.event.inputs.android_run_id }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN_ID" ]; then RUN_ID="$INPUT_RUN_ID"; elif [ -n "$EVENT_RUN_ID" ]; then RUN_ID="$EVENT_RUN_ID"; else exit 1; fi
          SOURCE_SHA=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.head_sha')
          SOURCE_CONCLUSION=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID" --jq '.conclusion')
          test "$SOURCE_CONCLUSION" = success
          { echo "smoke_head_sha=$GITHUB_SHA"; echo "apk_source_run=$RUN_ID"; echo "apk_source_head_sha=$SOURCE_SHA"; echo "apk_source_conclusion=$SOURCE_CONCLUSION"; } | tee provenance.txt
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"

      - name: Download exact release APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          STAGE="$RUNNER_TEMP/apk-staging"
          rm -rf "$STAGE" && mkdir -p "$STAGE/unpacked"
          ART_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name=="mobile-agent-russkiy-release-apk" and .expired==false) | .id' | head -1)
          test -n "$ART_ID"
          curl --fail --silent --show-error --location -H "Authorization: Bearer $GH_TOKEN" -o "$STAGE/artifact.zip" "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip"
          unzip -o "$STAGE/artifact.zip" -d "$STAGE/unpacked"
          CANDIDATES=$(find "$STAGE/unpacked" -type f -name '*.apk')
          test "$(printf '%s\n' "$CANDIDATES" | grep -c .)" -eq 1
          cp "$(echo "$CANDIDATES" | head -1)" release-smoke.apk
          sha256sum release-smoke.apk | tee apk-sha256.txt
          stat -c%s release-smoke.apk | tee apk-size.txt
          echo "artifact_id=$ART_ID" > apk-facts.txt
          echo "source_run_id=$RUN_ID" >> apk-facts.txt

      - name: M1 — release manifest
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)
          "$BT/aapt2" dump badging release-smoke.apk | tee badging.txt | head -25
          grep -q "package: name='ru.mirsamozanyatykh.mobileagent'" badging.txt
          grep -q "versionCode='3'" badging.txt

      - name: Prepare Chat runtime probe
        env:
          PROBE_SCRIPT: ${{ runner.temp }}/release-smoke-probe.sh
        run: |
          cat > "$PROBE_SCRIPT" <<'PROBE_EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          APK="$GITHUB_WORKSPACE/release-smoke.apk"
          test -s "$APK"
          adb install -r "$APK"
          adb logcat -c
          echo "INSTALL=PASS" | tee runtime.txt
          adb shell monkey -p ru.mirsamozanyatykh.mobileagent -c android.intent.category.LAUNCHER 1
          sleep 10
          adb exec-out screencap -p > chat-screenshot.png
          adb shell dumpsys activity activities | tr -d '\r' > chat-activities.txt
          adb shell dumpsys window | tr -d '\r' > chat-window.txt
          grep -q 'ru.mirsamozanyatykh.mobileagent' chat-activities.txt
          echo "CHAT_ROUTE=PASS" | tee -a runtime.txt
          adb shell uiautomator dump /sdcard/chat-ui.xml >/dev/null 2>&1 || true
          adb shell cat /sdcard/chat-ui.xml > chat-ui.xml 2>/dev/null || true
          adb logcat -d -v time > full-logcat.txt
          if grep -Eq 'FATAL EXCEPTION|AndroidRuntime.*FATAL' full-logcat.txt && grep -Eq 'Process: ru\.mirsamozanyatykh\.mobileagent([ ,]|$)' full-logcat.txt; then
            echo 'CRASH_GATE=FAIL' | tee -a runtime.txt
            exit 1
          fi
          echo 'CRASH_GATE=PASS' | tee -a runtime.txt
          echo 'P0_RUNTIME=PASS' | tee -a runtime.txt
          PROBE_EOF
          chmod +x "$PROBE_SCRIPT"
          bash -n "$PROBE_SCRIPT"

      - name: Release smoke on API 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: bash "${{ runner.temp }}/release-smoke-probe.sh"

      - name: Upload Chat runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-smoke-evidence
          path: |
            provenance.txt
            apk-facts.txt
            apk-sha256.txt
            apk-size.txt
            badging.txt
            runtime.txt
            chat-screenshot.png
            chat-activities.txt
            chat-window.txt
            chat-ui.xml
            full-logcat.txt
          if-no-files-found: warn
