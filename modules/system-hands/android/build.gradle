plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.systemhands'
version = '1.0.0'

android {
  namespace "expo.modules.systemhands"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
    minSdkVersion 26
  }
}

dependencies {
  // Keep the base Activity artifact explicit: ActivityResultLauncher and
  // ActivityResultContracts are defined there. The KTX artifact supplies
  // Kotlin extensions but must not be the only dependency we rely on.
  api("androidx.activity:activity:1.10.1")
  api("androidx.activity:activity-ktx:1.10.1")
}
