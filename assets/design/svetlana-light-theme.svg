<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1400" viewBox="0 0 1600 1400">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#faf8f5"/><stop offset="1" stop-color="#e8e3dc"/></linearGradient>
 <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8b5cf6"/><stop offset="1" stop-color="#c4b5fd"/></linearGradient>
 <filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-opacity=".12"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <clipPath id="portrait"><circle cx="330" cy="365" r="285"/></clipPath>
 <clipPath id="thumb1"><circle cx="735" cy="330" r="75"/></clipPath>
 <clipPath id="thumb2"><circle cx="930" cy="330" r="75"/></clipPath>
 <clipPath id="thumb3"><circle cx="1125" cy="330" r="75"/></clipPath>
 <clipPath id="thumb4"><circle cx="1320" cy="330" r="75"/></clipPath>
 <clipPath id="emotion"><rect x="660" y="505" width="170" height="210" rx="22"/></clipPath>
</defs>
<rect width="1600" height="1400" fill="url(#bg)"/>
<!-- Header -->
<text x="700" y="95" font-family="sans-serif" font-size="62" font-weight="700" fill="#171321">Светлана</text>
<text x="704" y="140" font-family="sans-serif" font-size="29" fill="#7c5ce6">AI-ассистент OX2</text>
<text x="704" y="185" font-family="sans-serif" font-size="22" fill="#5f5968">Ваш интеллектуальный голосовой помощник.</text>
<text x="704" y="217" font-family="sans-serif" font-size="22" fill="#5f5968">Всегда на связи, всегда готова помочь.</text>
<circle cx="1450" cy="105" r="55" fill="#fff" stroke="#a78bfa" stroke-width="5" filter="url(#shadow)"/>
<text x="1410" y="116" font-family="sans-serif" font-size="28" font-weight="700" fill="#171321">OX2</text>
<!-- Main portrait card -->
<circle cx="330" cy="365" r="305" fill="#fff" filter="url(#shadow)"/>
<circle cx="330" cy="365" r="300" fill="none" stroke="url(#purple)" stroke-width="10" filter="url(#glow)"/>
<image x="45" y="80" width="570" height="570" xlink:href="../images/svetlana-approved.svg" preserveAspectRatio="xMidYMid slice" clip-path="url(#portrait)"/>
<circle cx="330" cy="365" r="285" fill="none" stroke="#ffffff" stroke-width="5" opacity=".9"/>
<circle cx="330" cy="615" r="62" fill="#fff" stroke="#a78bfa" stroke-width="5" filter="url(#shadow)"/>
<path d="M330 580v48 M308 620c0 20 44 20 44 0 M303 602v20c0 30 54 30 54 0v-20 M316 650h28" fill="none" stroke="#7c5ce6" stroke-width="8" stroke-linecap="round"/>
